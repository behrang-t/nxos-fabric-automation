---
ansible_connection: ansible.netcommon.network_cli
ansible_network_os: cisco.nxos.nxos

ansible_user: "{{ vault_lab_username }}"
ansible_password: "{{ vault_lab_password }}"

ansible_command_timeout: 90
ansible_connect_timeout: 30

fabric_name: nxos_multisite_evpn_lab
fabric_site: multisite_lab

evidence_root: evidence_pack
raw_evidence_dir: raw
report_evidence_dir: reports

vxlan_evpn_command_sets:
  platform:
    roles:
      - spine
      - leaf
      - border_gateway
      - dci
    commands:
      - show version
      - show running-config | include ^hostname
      - show feature
      - show interface brief
      - show ip interface brief vrf all
      - show vrf

  site_underlay:
    roles:
      - spine
      - leaf
      - border_gateway
    commands:
      - show ip ospf neighbors
      - show ip route
      - show ip pim neighbor
      - show ip pim interface

  evpn_control_plane:
    roles:
      - spine
      - leaf
      - border_gateway
      - dci
    commands:
      - show bgp l2vpn evpn summary
      - show bgp l2vpn evpn
      - show bgp l2vpn evpn route-type 2
      - show bgp l2vpn evpn route-type 3
      - show bgp l2vpn evpn route-type 5

  bgp_configuration:
    roles:
      - spine
      - leaf
      - border_gateway
      - dci
    commands:
      - show running-config | section bgp

  vxlan_nve:
    roles:
      - leaf
      - border_gateway
    commands:
      - show nve peers
      - show nve vni
      - show interface nve1
      - show running-config interface nve1

  tenant_state:
    roles:
      - leaf
      - border_gateway
    commands:
      - show vlan brief
      - show ip route vrf all
      - show mac address-table
      - show l2route evpn mac-ip all
      - show ip arp vrf all

  multisite_state:
    roles:
      - border_gateway
    commands:
      - show running-config | include evpn
      - show running-config | include fabric-tracking
      - show running-config | include dci-tracking
      - show running-config interface loopback100

  dci_state:
    roles:
      - dci
    commands:
      - show bgp ipv4 unicast summary
      - show ip route
      - show running-config interface loopback0
