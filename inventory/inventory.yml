---
all:
  children:
    fabric_nodes:
      children:
        nxos:
          children:
            spines:
              vars:
                fabric_role: spine
              hosts:
                spine1:
                  ansible_host: 192.168.2.140
                  eve_node: NXOS
                  mgmt_interface: mgmt0

                spine2:
                  ansible_host: 192.168.2.146
                  eve_node: NXOS18
                  mgmt_interface: mgmt0

            border_gateways:
              vars:
                fabric_role: border_gateway
              hosts:
                bgw1:
                  ansible_host: 192.168.2.141
                  eve_node: NXOS2
                  mgmt_interface: mgmt0

                bgw2:
                  ansible_host: 192.168.2.145
                  eve_node: NXOS17
                  mgmt_interface: mgmt0

            leaves:
              vars:
                fabric_role: leaf
              hosts:
                leaf1:
                  ansible_host: 192.168.2.142
                  eve_node: NXOS3
                  mgmt_interface: mgmt0

                leaf2:
                  ansible_host: 192.168.2.143
                  eve_node: NXOS5
                  mgmt_interface: mgmt0

                leaf3:
                  ansible_host: 192.168.2.144
                  eve_node: NXOS6
                  mgmt_interface: mgmt0

            dci_nodes:
              vars:
                fabric_role: dci
              hosts:
                dci:
                  ansible_host: 192.168.2.147
                  eve_node: NXOS19
                  mgmt_interface: mgmt0

    traffic_endpoints:
      hosts:
        server1:
          ansible_host: 192.168.2.13
          probe_source_interface: eth0
          endpoint_ip: 10.10.10.10
          default_gateway: 10.10.10.1
          attached_device: leaf1

        server2:
          ansible_host: 192.168.2.14
          probe_source_interface: eth0
          endpoint_ip: 10.10.10.11
          default_gateway: 10.10.10.1
          attached_device: leaf2

        server3:
          ansible_host: 192.168.2.15
          probe_source_interface: eth0
          endpoint_ip: 10.10.11.11
          default_gateway: 10.10.11.1
          attached_device: leaf3

    external_nodes:
      children:
        wan_routers:
          hosts:
            wan_r9:
              ansible_host: 192.168.2.148
              eve_node: R9
              fabric_role: wan
              phase1_collect: false
